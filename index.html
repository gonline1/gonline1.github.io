<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Game Hub — Open Source Collection</title>
<style>
  :root{
    --bg:#0b1220; --panel:#071827; --accent:#4ade80; --muted:#9aa6b2; --text:#eaf6ff;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{ margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial; background:linear-gradient(180deg,#041022,#071427); color:var(--text); display:flex; justify-content:center; padding:28px; min-height:100vh}
  .wrap{ width:100%; max-width:1100px; display:grid; grid-template-columns:300px 1fr; gap:20px; }
  header{ grid-column:1/-1; display:flex; align-items:center; gap:12px; margin-bottom:6px}
  h1{ margin:0; font-size:20px }
  .left{ background:var(--panel); padding:14px; border-radius:var(--radius); box-shadow:0 10px 30px rgba(0,0,0,.5); min-height:520px }
  .right{ background:var(--panel); padding:14px; border-radius:var(--radius); box-shadow:0 10px 30px rgba(0,0,0,.5); min-height:520px; display:flex; flex-direction:column; }
  .section-title{ color:var(--muted); font-size:13px; margin-bottom:8px }
  .input{ width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.03); background:transparent; color:inherit; margin-bottom:8px }
  .btn{ background:transparent; border:1px solid rgba(255,255,255,0.04); padding:8px 12px; border-radius:10px; color:var(--muted); cursor:pointer }
  .btn.primary{ border-color:rgba(74,222,128,0.14); color:var(--accent) }
  .games{ display:flex; flex-direction:column; gap:8px; max-height:300px; overflow:auto; margin-bottom:10px }
  .game-item{ padding:8px; border-radius:8px; background:rgba(255,255,255,0.02); cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .game-item.active{ outline:2px solid rgba(74,222,128,0.08) }
  #gameContainer{ flex:1; display:flex; flex-direction:column; position:relative; }
  iframe{ width:100%; height:100%; border:none; border-radius:10px; background:#000; flex:1 }
  .controls{ display:flex; gap:8px; align-items:center; margin-top:10px }
  .muted{ color:var(--muted); font-size:13px }
  footer{ grid-column:1/-1; color:var(--muted); text-align:center; font-size:13px; margin-top:12px }
  @media (max-width:900px){ .wrap{ grid-template-columns:1fr } .left{ order:2 } .right{ order:1 } }
</style>
</head>
<body>
  <div class="wrap" role="application">
    <header>
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="#071827"/><path d="M6 9h12M6 15h8" stroke="#4ade80" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div>
        <h1>Game Hub — Open Source Collection</h1>
        <div class="muted">Play and embed open source HTML5 games.</div>
      </div>
    </header>

    <aside class="left">
      <div class="section-title">Available Games</div>
      <div class="games" id="gamesList"></div>

      <div style="margin-top:10px">
        <input id="newTitle" class="input" placeholder="Game title (required)">
        <input id="newUrl" class="input" placeholder="Game URL (https://...) (required)">
        <div style="display:flex; gap:8px">
          <button id="saveBtn" class="btn primary">Save</button>
          <button id="removeBtn" class="btn">Remove</button>
          <button id="resetBtn" class="btn">Reset</button>
        </div>
      </div>
    </aside>

    <main class="right">
      <div style="display:flex; gap:12px; align-items:center; margin-bottom:8px">
        <div style="flex:1">
          <input id="urlInput" class="input" placeholder="Enter HTTPS game URL (or pick from left)">
        </div>
        <div style="display:flex; flex-direction:column; gap:8px">
          <button id="loadBtn" class="btn primary">Load</button>
          <button id="openBtn" class="btn">Open Tab</button>
        </div>
      </div>

      <div id="gameContainer">
        <iframe id="gameFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"></iframe>
      </div>

      <div class="controls">
        <button id="fullscreenBtn" class="btn">Fullscreen</button>
        <div class="muted" id="status">Ready.</div>
      </div>
    </main>

    <footer>Enjoy open source classics — add more via the form on the left.</footer>
  </div>

<script type="module">
const KEY='gamehub_saved_games_v2';
const DEFAULTS=[
  {title:'2048',url:'https://gabrielecirulli.github.io/2048/'},
  {title:'Hextris',url:'https://hextris.github.io/hextris/'},
  {title:'Tetris',url:'https://javalab.org/tetris_en/'},
  {title:'Pac-Man',url:'https://pacman.cc/'},
  {title:'Flappy Bird',url:'https://flappybird.io/'},
  {title:'Asteroids',url:'https://freejsgame.github.io/asteroids/'}
];
let saved=[],selectedIndex=-1;

// elements
const gamesList=document.getElementById('gamesList');
const newTitle=document.getElementById('newTitle');
const newUrl=document.getElementById('newUrl');
const saveBtn=document.getElementById('saveBtn');
const removeBtn=document.getElementById('removeBtn');
const resetBtn=document.getElementById('resetBtn');
const loadBtn=document.getElementById('loadBtn');
const openBtn=document.getElementById('openBtn');
const urlInput=document.getElementById('urlInput');
const gameFrame=document.getElementById('gameFrame');
const fullscreenBtn=document.getElementById('fullscreenBtn');
const status=document.getElementById('status');
const container=document.getElementById('gameContainer');

// load saved or defaults
function loadSaved(){
  try{const raw=localStorage.getItem(KEY);saved=raw?JSON.parse(raw):DEFAULTS.slice()}
  catch(e){saved=DEFAULTS.slice()}
}
function saveSaved(){localStorage.setItem(KEY,JSON.stringify(saved))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shorten(u){try{return new URL(u).hostname}catch(e){return u.slice(0,36)}}

// render saved list
function renderList(){
  gamesList.innerHTML='';
  saved.forEach((g,i)=>{
    const el=document.createElement('div');
    el.className='game-item'+(i===selectedIndex?' active':'');
    el.innerHTML=`<div style="flex:1">${escapeHtml(g.title)}</div><div style="font-size:12px;color:var(--muted)">${shorten(g.url)}</div>`;
    el.addEventListener('click',()=>{selectedIndex=i;urlInput.value=g.url;highlight()});
    el.addEventListener('dblclick',()=>loadGame(g.url,g.title));
    gamesList.appendChild(el);
  });
}
function highlight(){Array.from(gamesList.children).forEach((c,i)=>c.classList.toggle('active',i===selectedIndex))}

// base actions
saveBtn.onclick=()=>{
  const t=newTitle.value.trim(),u=newUrl.value.trim();
  if(!t||!u){alert('Enter both title and URL');return;}
  saved.push({title:t,url:u});saveSaved();renderList();newTitle.value=newUrl.value='';status.textContent='Saved.';
}
removeBtn.onclick=()=>{if(selectedIndex<0){alert('Select a game');return;}saved.splice(selectedIndex,1);selectedIndex=-1;saveSaved();renderList()}
resetBtn.onclick=()=>{if(confirm('Reset to defaults?')){saved=DEFAULTS.slice();saveSaved();renderList()}}
loadBtn.onclick=()=>{const u=urlInput.value.trim();if(!u)return alert('Enter a URL');loadGame(u,'Custom')}
openBtn.onclick=()=>{const src=gameFrame.src||urlInput.value.trim();if(src)window.open(src,'_blank')}
fullscreenBtn.onclick=()=>{container.requestFullscreen?.()}
function loadGame(url,title){gameFrame.src=url;status.textContent='Loaded: '+(title||url);}

// init
loadSaved();renderList();
</script>
</body>
</html>
